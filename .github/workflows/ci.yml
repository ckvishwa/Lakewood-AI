name: CI

# T-054: this repo previously had NO CI at all (zero workflows, main
# unprotected — see docs/SECURITY_AUDIT_T054.md Part 7). This workflow is
# the first one. The `gate`/`secret-scan`/`dependency-audit`/`sast` jobs
# stay fully offline by design (docs/decisions/ADR-009, ADR-014,
# ADR-016): no live API key, GPU, printer, or microphone is available or
# required. `postgres-contract` (T-053 Phase 1 Part B) is the one
# exception — a real Postgres service container, not a mock — kept as
# its own separate job so a Postgres-side failure never blocks or is
# blocked by the offline gate. Costs real extra Actions minutes on this
# private repo (a second Python setup + a running service container per
# run) — worth it because PostgresSessionRepository shipped two real,
# reproducible concurrency bugs (an idle-in-transaction deadlock, an
# unguarded check-then-insert race) that the in-memory repository and the
# offline gate structurally could not have caught; see docs/STATUS.md's
# T-053 Phase 1 entry.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Full offline gate (unit + acceptance + eval gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      # T-016/ADR-009: pytest carries BOTH eval gates — label-correctness
      # (test_all_golden_labels_are_valid) and the ratcheted, offline,
      # deterministic RuleBasedInterpreter regression check
      # (test_rule_based_interpreter_meets_baseline). No live model, no
      # network, no Postgres server, no printer, no microphone.
      - name: Unit + acceptance suite (both eval gates)
        run: python -m pytest -q

      - name: Eval label validation (label correctness only — ADR-009)
        run: python evals/runner.py validate

      - name: Pricing parity
        run: python -m pytest -q tests/test_pricing_parity.py

  secret-scan:
    name: Secret scanning (gitleaks, full history)
    runs-on: ubuntu-latest
    # T-058: on a pull_request trigger, gitleaks-action's PR-diff mode calls
    # GET /repos/.../pulls/{n}/commits to enumerate the PR's own commits —
    # the workflow-level `contents: read` alone doesn't cover that; a
    # private repo's default GITHUB_TOKEN is more restrictive than a public
    # one, and the job failed with "Resource not accessible by integration"
    # until this was added (confirmed via a real PR run, not just a YAML
    # read — see docs/STATUS.md's T-058 entry).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit requirements.txt
        run: python -m pip_audit -r requirements.txt

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade pip bandit
      # -ll: medium+ confidence/severity only, to keep this a real gate and
      # not noise; scoped to the actual application code, never vendored
      # environments (none are tracked in git, but -x is explicit defense
      # in depth against a future one landing accidentally).
      - name: Run bandit against lakewood/ and scripts/
        run: python -m bandit -r lakewood scripts -ll -x "*/env/*,*/.venv*/*"

  postgres-contract:
    name: Postgres contract suite (real server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: lakewood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LAKEWOOD_POSTGRES_TEST_DSN: postgresql://postgres:testpass@localhost:5432/lakewood_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt psycopg2-binary
      - name: Migrations up
        run: python -m lakewood.persistence.migrations.runner up "$LAKEWOOD_POSTGRES_TEST_DSN"
      # Reversibility proven for real on every run, not just read from SQL.
      - name: Migrations down (both, proving reversibility)
        run: |
          python -m lakewood.persistence.migrations.runner down "$LAKEWOOD_POSTGRES_TEST_DSN"
          python -m lakewood.persistence.migrations.runner down "$LAKEWOOD_POSTGRES_TEST_DSN"
      - name: Migrations up again (tests need the real schema)
        run: python -m lakewood.persistence.migrations.runner up "$LAKEWOOD_POSTGRES_TEST_DSN"
      - name: Contract + tenant-isolation + concurrency suites against the real server
        run: >-
          python -m pytest -q
          tests/test_persistence_postgres_contract.py
          tests/test_persistence_tenant_isolation.py
          tests/test_persistence_postgres_concurrency.py
