- id: MOD-034
  tags: [modifier, removal, correction]
  setup: {order_type: pickup}
  turns:
    - user: "large pizza with mushrooms"
      calls:
        - {tool: add_item, args: {item: CHEESE PIZZA, size: large}}
        - {tool: add_modifier, args: {line_id: L1, modifier: mushroom}}
    - user: "actually take the mushrooms off"
      calls:
        - {tool: remove_modifier, args: {line_id: L1, modifier: mushroom}}
  assert_final: {subtotal: "15.00", state: BUILDING}

- id: GOURMET-013
  tags: [specialty, half_and_half_sku]
  # T-008: the HALF_AND_HALF SKU (lakewood/pricing.py PizzaLine.half_and_half)
  # — two named specialties, larger-half-only/flat gourmet price, owner-
  # confirmed specialty/specialty only — is now reachable via
  # add_item(second_gourmet_number=...). Distinct from the `half_additive`
  # path every other half-and-half case in this corpus uses (MOD-014,
  # MOD-030, MOD-031, CORRECT-005, GOURMET-010): those build a half split out
  # of per-topping HALF_1/HALF_2 modifiers on one gourmet/cheese base, priced
  # additively; this one names two whole specialties directly and is priced
  # flat, per size, regardless of which two. Value reused verbatim from the
  # already-verified 'SM half&half' case in tests/test_pricing_parity.py.
  setup: {order_type: pickup}
  turns:
    - user: "small pizza, half number ten Hawaiian, half number eight BBQ chicken"
      calls:
        - {tool: add_item, args: {item: PIZZA, size: small, gourmet_number: 10, second_gourmet_number: 8}}
  assert_final: {subtotal: "16.00", state: BUILDING}

