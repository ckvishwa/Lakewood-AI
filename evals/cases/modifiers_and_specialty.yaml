# Modifier scope (whole vs half), intensity, specialty-pizza customization,
# and slang/short-form requests. Subtotals reuse the same verified per-topping
# tier rates as tests/test_pricing_parity.py — no new pricing rule exercised.
- id: MOD-030
  tags: [modifier, half, portion]
  setup: {order_type: pickup}
  turns:
    - user: "large pizza with pepperoni on the whole thing and mushroom just on one half"
      calls:
        - {tool: add_item, args: {item: CHEESE PIZZA, size: large}}
        - {tool: add_modifier, args: {line_id: L1, modifier: pepperoni, portion: WHOLE}}
        - {tool: add_modifier, args: {line_id: L1, modifier: mushroom, portion: HALF_2}}
  assert_final: {subtotal: "21.00", state: BUILDING}

- id: MOD-031
  tags: [modifier, half, portion]
  setup: {order_type: pickup}
  turns:
    - user: "large half sausage and ham, half bacon and olives"
      calls:
        - {tool: add_item, args: {item: CHEESE PIZZA, size: large}}
        - {tool: add_modifier, args: {line_id: L1, modifier: sausage, portion: HALF_1}}
        - {tool: add_modifier, args: {line_id: L1, modifier: ham, portion: HALF_1}}
        - {tool: add_modifier, args: {line_id: L1, modifier: bacon, portion: HALF_2}}
        - {tool: add_modifier, args: {line_id: L1, modifier: olives, portion: HALF_2}}
  assert_final: {subtotal: "27.00", state: BUILDING}

